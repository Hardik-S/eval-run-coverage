[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-run-coverage"
version = "0.1.0"
description = "Offline JSONL evaluation run coverage checker"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
eval-run-coverage = "eval_run_coverage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
